{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WorkView</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
        <style>
            .hover-card {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .hover-card:hover {
                transform: scale(1.02);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            }
            body, html {
                height: 100%;
                margin: 0;
                scroll-behavior: smooth;
                font-family: 'Roboto', sans-serif;
            }
            .container {
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }
            .bg-image {
                background-image: url('../../static/images/image.png');
                background-size: cover;
                background-position: center;
                height: 100vh;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .content {
                text-align: center;
            }
            .section {
                padding: 60px 20px;
                background-color: #f7f7f7;
            }
            .navbar {
            background-color: #ffffff; 
            padding: 10px 20px;
            font-weight: normal;
            }

            .navbar-brand img {
            max-height: 40px;
            }

            .navbar-brand {
            
            font-size: 1.5rem;
            color: #1e3a8a; 
            text-transform: uppercase;
            }

            .navbar-brand:hover {
            color: #60a5fa; /* Lighter blue for hover */
            }

            .navbar-nav {
            margin-left: auto;
            }

            .navbar-nav .nav-link {
            color: #3b82f6; /* Blue color for links */
            margin-right: 15px;
           
            transition: all 0.3s ease;
            }

            .navbar-nav .nav-link:hover {
            color: #60a5fa; /* Lighter blue on hover */
            transform: scale(1.1);
            }

            .navbar-toggler {
            border: none;
            background-color: #60a5fa; /* Vibrant blue for toggler */
            }

            .navbar-toggler:hover {
            background-color: #3b82f6; /* Darker blue on hover */
            }

            .navbar-toggler-icon {
            background-image: url("data:image/svg+xml;charset=UTF8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Cpath stroke='white' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
            }

        .footer {
                background-color: #343a40;
                color: white;
                padding: 20px 0;
            }



        </style>
    </head>
    <body>
        <!-- Navbar -->
        {% include 'landing/navbar.html' %}
        

    <!-- Hero Section -->
    <div class="bg-image">
        <div class="content">
            <h1 class="display-1 fw-bold">WELCOME TO WORKVIEW</h1>
            <p class="lead fw-semibold">WE HELP YOU MANAGE YOUR WORK ON THE GO!</p>
            <a href="{% url 'register' %}" class="btn btn-primary btn-lg fw-bold">Get Started</a>
        </div>
    </div>

    <!-- Include Components -->
    <div class="components">
        {% include 'landing/about.html' %}
        {% include 'landing/services.html' %}
        {% include 'landing/contact_form.html' %}
    </div>

    <!-- Footer -->
    <footer class="footer text-center">
        <div class="container">
            <p>&copy; 2024 WorkView. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
