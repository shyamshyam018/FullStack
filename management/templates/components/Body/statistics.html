<div class="col-xl-6 grid-margin stretch-card flex-column">
  <h5 class="mb-2 text-titlecase mb-4">Status statistics</h5>
  <div class="row">
    <div class="col-md-6 grid-margin stretch-card">
      <div class="card">
        <div class="card-body d-flex flex-column justify-content-between">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <p class="mb-0 text-muted">Peak Work Hours</p>
            <p class="mb-0 text-muted">All Days</p>
          </div>
          <canvas id="PeakHourGraph" class="mt-auto"></canvas>
        </div>
      </div>
    </div>
    <div class="col-md-6 grid-margin stretch-card">
      <div class="card">
        <div class="card-body d-flex flex-column justify-content-between">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              <p class="mb-2 text-muted">Sales</p>
              <h6 class="mb-0">563</h6>
            </div>
            <div>
              <p class="mb-2 text-muted">Orders</p>
              <h6 class="mb-0">720</h6>
            </div>
            <div>
              <p class="mb-2 text-muted">Revenue</p>
              <h6 class="mb-0">5900</h6>
            </div>
          </div>
          <canvas id="ProductivityGraph" class="mt-auto" ></canvas>
        </div>
      </div>
    </div>
  </div>
  <div class="row h-100">
    <div class="col-md-6 stretch-card grid-margin grid-margin-md-0">
      <div class="card">
        <div class="card-body d-flex flex-column justify-content-between">
          <p class="text-muted">Sales Analytics</p>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h3 class="mb-">27632</h3>
            <h3 class="mb-">78%</h3>
          </div>
          <canvas id="EfficiencyGraph" class="mt-auto" height="38"></canvas>
        </div>
      </div>
    </div>
    <div class="col-md-6 stretch-card">
      <div class="card">
        <div class="card-body">
          <div class="row h-100">
            <div class="col-6 d-flex flex-column justify-content-between">
              <p class="text-muted">CPU</p>
              <h4>55%</h4>
              <canvas id="LocationGraph" class="mt-auto"></canvas>
            </div>
            <div class="col-6 d-flex flex-column justify-content-between">
              <p class="text-muted">Memory</p>
              <h4>123,65</h4>
              <canvas id="SkibidiGraph" class="mt-auto"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>



<script>

document.addEventListener("DOMContentLoaded", function () {
  if ($("#PeakHourGraph").length) {
    const ctx1 = document.getElementById('PeakHourGraph').getContext("2d");

    var graphGradient1 = ctx1.createLinearGradient(0, 0, 0, 120);
    graphGradient1.addColorStop(0, 'rgba(255, 255, 255, 1)');
    graphGradient1.addColorStop(1, 'rgba(243, 153, 21, .6)');

    let PeakHourGraph = new Chart(ctx1, {
  type: 'line',
  data: {
    labels: ["8am", "9am", "10am", "11am", "12pm", "13pm", "14pm", "15pm", "16pm", "17pm", "18pm", "19pm"],
    datasets: [{
      data: [1, 3, 2, 5, 4, 8, 6, 7, 9, 10, 5, 3],
      backgroundColor: graphGradient1,
      borderColor: ['#f39915'],
      borderWidth: 3,
      fill: 'origin',
      label: "workers",
      pointRadius: 0.5,
      tension: 0.4,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: true,
    aspectRatio: 2,
    scales: {
      x: {
        border: { display: true },
        grid: { display: true, drawTicks: true },
        ticks: { color: "#6C7383", display: true }
      },
      y: {
        min: 1,  
        max: 11, 
        beginAtZero: false, 
        border: { display: true },
        grid: { display: true },
        ticks: { color: "#6C7383", display: true, stepSize: 1 }
      }
    },
    plugins: {
      legend: { display: false },
      labels: { color: "#003c7c" },
    }
  }
});
  }
});

document.addEventListener("DOMContentLoaded", function () {
  if ($("#ProductivityGraph").length) {
    const ctx2 = document.getElementById('ProductivityGraph').getContext("2d");

    // Parse data from template context
    const productivityData = JSON.parse('{{ productivity_data|escapejs }}');


    const labels = Object.keys(productivityData); // Dates
    const data = Object.values(productivityData); // Hours worked

    let ProductivityGraph = new Chart(ctx2, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            data: data, 
            backgroundColor: '#2981d7',
            borderColor: '#2981d7',
            borderWidth: 2,
            fill: 'origin',
            label: "Hours Worked",
            pointRadius: 1,
            tension: 0.4,
          },
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true, 
        aspectRatio: 2,
        scales: {
          x: {
            border: { display: true },
            grid: { display: true, drawTicks: true },
            ticks: { color: "#6C7383", display: true },
          },
          y: {
            beginAtZero: false,
            border: { display: true },
            grid: { display: true },
            ticks: {
              color: "#6C7383",
              stepSize: 1,
              display: true,
            },
          },
        },
        plugins: {
          legend: {
            display: false,
            labels: { color: "#003c7c" },
          },
        },
      },
    });
  }
});

document.addEventListener("DOMContentLoaded", function () {
  if ($("#EfficiencyGraph").length) {
    const ctx3 = document.getElementById('EfficiencyGraph').getContext("2d");
    const efficiencyData = JSON.parse('{{ efficiency_data|escapejs }}');

    new Chart(ctx3, {
      type: 'bar',
      data: {
        labels: ['Forenoon', 'Midday', 'Afternoon'], 
        datasets: [
          {
            label: 'Work Done',
            data: efficiencyData,  
            backgroundColor: ['#3b86d1', '#b4d5f6', '#3b86d1'] // Colors for each session
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        aspectRatio: 2,
        scales: {
          x: {
            grid: { display: false },
            ticks: {
              color: "#6C7383",
              beginAtZero: true
            }
          },
          y: {
            beginAtZero: true,
            grid: { display: false },
            ticks: {
              color: "#6C7383",
              stepSize: 1
            }
          }
        },
        plugins: {
          legend: {
            display: false
          }
        }
      }
    });
  }
});

  document.addEventListener("DOMContentLoaded", function () {

  document.addEventListener("DOMContentLoaded", function () {
  if ($("#SkibidiGraph").length) {
    const ctx5 = document.getElementById('SkibidiGraph');
      new Chart(ctx5, {
        type: 'bar',
        data: {
					labels: ["A", "B", "C", "D", "E","F", "G", "H", "I", "J", "K", "L"],
          datasets: [
            {
              label: 'Profit',
              data: [38, 35, 23, 22, 35, 23, 24, 28, 19, 33, 30, 45],

            }
          ]
        },
				options: {
          responsive: true,

          elements: {

          scales: {
            x: {
              border: {

              grid: {

            },
            y: {

              ticks: {

            }
          },
          plugins: {
            legend: {

      });

    }

</script>
