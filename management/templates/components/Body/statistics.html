<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
 document.addEventListener("DOMContentLoaded", function () {
  if ($("#PeakHourGraph").length) {
    const ctx1 = document.getElementById('PeakHourGraph').getContext("2d");

    var graphGradient1 = ctx1.createLinearGradient(0, 0, 0, 120);
    graphGradient1.addColorStop(0, 'rgba(255, 255, 255, 1)');
    graphGradient1.addColorStop(1, 'rgba(243, 153, 21, .6)');

    let PeakHourGraph = new Chart(ctx1, {
  type: 'line',
  data: {
    labels: ["8AM", "9AM", "10AM", "11AM", "12PM", "13PM", "14PM", "15PM", "16PM", "17PM", "18PM", "19PM"],
    datasets: [{
      data: [1, 3, 2, 5, 4, 8, 6, 7, 9, 10, 5, 3],
      backgroundColor: graphGradient1,
      borderColor: ['#f39915'],
      borderWidth: 3,
      fill: 'origin',
      label: "workers",
      pointRadius: 0.5,
      tension: 0.4,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: true, // Allow it to stretch in height
    aspectRatio: 2, // Adjust aspect ratio to control the height-to-width ratio
    scales: {
      x: {
        border: { display: true },
        grid: { display: true, drawTicks: true },
        ticks: { color: "#6C7383", display: true }
      },
      y: {
        min: 1,  
        max: 11, 
        beginAtZero: false, 
        border: { display: true },
        grid: { display: true },
        ticks: { color: "#6C7383", display: true, stepSize: 1 }
      }
    },
    plugins: {
      legend: { display: false }
    }
  }
});
  }
});

</script>
